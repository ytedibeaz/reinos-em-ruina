<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reinos em Ruína</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#355b36;color:#fff;font:14px system-ui}#ui{height:54px;background:#111b24;display:flex;gap:18px;align-items:center;padding:0 14px}canvas{display:block;width:100%;height:calc(100% - 54px)}button{padding:8px 12px;background:#30465a;color:white;border:1px solid #67809a;border-radius:7px;font-weight:700;cursor:pointer}.g{color:#ffd166}.l{color:#ff7777}</style><div id="ui"><b>🏰 REINOS EM RUÍNA</b><span class="g">🪙 <b id="gold">1000</b></span><span class="l">❤ <b id="life">20</b></span><span>🌊 Onda <b id="wave">0</b></span><button onclick="start()">COMEÇAR ONDA</button><button onclick="spd=spd==1?2:1">Velocidade <b id="speed">1x</b></button></div><canvas id="c"></canvas><script>const C=document.querySelector('canvas'),X=C.getContext('2d');let W,H,scale,spd=1,gold=1000,life=20,wave=0,run=0,spawn=0,left=0,mobs=[],plats=[],last=0;function size(){W=innerWidth;H=innerHeight-54;C.width=W;C.height=H;make()}let P=[];function make(){let s=Math.min(W/1200,H/650),ox=(W-1200*s)/2,oy=(H-650*s)/2;P=[[45,90],[210,90],[210,260],[420,260],[420,120],[650,120],[650,410],[860,410],[860,210],[1120,210],[1120,520],[1190,520]].map(([a,b])=>[a*s+ox,b*s+oy]);plats=[];for(let i=0;i<P.length-1;i++){let a=P[i],b=P[i+1],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;for(let q of[-1,1]){let px,py;if(Math.abs(a[0]-b[0])>Math.abs(a[1]-b[1])){px=mx;py=my+q*75}else{px=mx+q*75;py=my}if(px>80&&px<W-80&&py>80&&py<H-50)plats.push({x:px,y:py,t:null})}}}let L=[];for(let i=1;i<P.length;i++)L[i-1]=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);}function at(q){for(let i=0;i<L.length;i++){if(q<=L[i]){let a=P[i],b=P[i+1],z=q/L[i];return[a[0]+(b[0]-a[0])*z,a[1]+(b[1]-a[1])*z]}q-=L[i]}return P.at(-1)}let total;function start(){if(run)return;run=1;wave++;left=8+wave*3;spawn=0;document.querySelector('#wave').textContent=wave}function mob(){let k=Math.random()<.65?'goblin':Math.random()<.5?'spider':'orc',s=k=='goblin'?65:k=='spider'?100:42,h=k=='goblin'?42:k=='spider'?28:100;mobs.push({k,q:0,s,h,m:h,a:Math.random()*7})}function tower(p,k){let cost={archer:120,cannon:220,ice:180,fire:300}[k];if(gold>=cost&&!p.t){gold-=cost;p.t={k,l:1,cd:0}}}C.onclick=e=>{let r=C.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;for(let p of plats)if(Math.hypot(mx-p.x,my-p.y)<30&&!p.t){let k=prompt('Digite: archer, cannon, ice ou fire');if(['archer','cannon','ice','fire'].includes(k))tower(p,k)}};function drawMob(m){let p=at(m.q),n=at(Math.min(total,m.q+4)),ang=Math.atan2(n[1]-p[1],n[0]-p[0]),bob=Math.sin(m.a*7)*2;X.save();X.translate(p[0],p[1]+bob);X.rotate(ang);let z=m.k=='orc'?1.25:1;m.k=='spider'?(X.fillStyle='#25212b',X.beginPath(),X.ellipse(0,4,18,13,0,0,7),X.fill(),X.strokeStyle='#17131b',X.lineWidth=4,[ -2,-1,0,1,2].forEach(i=>{X.beginPath();X.moveTo(-8,i*5);X.lineTo(-28,i*7-5);X.moveTo(8,i*5);X.lineTo(28,i*7-5);X.stroke()})):(X.scale(z,z),X.fillStyle=m.k=='orc'?'#5e7d3f':'#6e8e48',X.beginPath(),X.roundRect(-14,-2,28,27,8),X.fill(),X.fillStyle='#91a75f',X.beginPath(),X.arc(0,-16,16,0,7),X.fill(),X.fillStyle='#3b281d',X.beginPath(),X.moveTo(-16,-22),X.lineTo(-27,-31),X.lineTo(-10,-28),X.lineTo(0,-35),X.lineTo(12,-28),X.lineTo(27,-31),X.lineTo(16,-18),X.fill(),X.fillStyle='#f4e4c3',X.fillRect(-9,-17,5,5),X.fillRect(4,-17,5,5),X.fillStyle='#111',X.fillRect(-7,-16,2,2),X.fillRect(6,-16,2,2),X.fillStyle='#563923',X.fillRect(-16,22,10,13),X.fillRect(6,22,10,13));X.restore();X.fillStyle='#241b18';X.fillRect(p[0]-20,p[1]-30,40,5);X.fillStyle='#63d16c';X.fillRect(p[0]-20,p[1]-30,40*Math.max(0,m.h/m.m),5)}function loop(t){let dt=Math.min(.035,(t-last)/1000||.016)*spd;last=t;X.fillStyle='#477c45';X.fillRect(0,0,W,H);X.lineCap='round';X.lineWidth=60;X.strokeStyle='#334c32';X.beginPath();P.forEach((p,i)=>i?X.lineTo(...p):X.moveTo(...p));X.stroke();X.lineWidth=48;X.strokeStyle='#a18a68';X.beginPath();P.forEach((p,i)=>i?X.lineTo(...p):X.moveTo(...p));X.stroke();let a=P[0],b=P.at(-1);X.fillStyle='#33241a';X.fillRect(a[0]-28,a[1]-38,56,76);X.fillStyle='#b8a17c';X.fillRect(b[0]-32,b[1]-42,64,84);X.fillStyle='#fff';X.textAlign='center';X.font='bold 12px system-ui';X.fillText('ENTRADA',a[0],a[1]-48);X.fillText('CASTELO',b[0],b[1]-52);plats.forEach(p=>{X.fillStyle=p.t?'#776a55':'#c0a97a';X.beginPath();X.arc(p.x,p.y,28,0,7);X.fill();if(p.t){X.fillStyle='#303944';X.fillRect(p.x-6,p.y-20,12,24);X.font='18px serif';X.fillText({archer:'🏹',cannon:'💣',ice:'❄️',fire:'🔥'}[p.t.k],p.x,p.y+7)}});if(run&&left>0){spawn-=dt;if(spawn<=0){mob();left--;spawn=.5}}for(let m of mobs){m.q+=m.s*dt;m.a+=dt;if(m.q>=total){m.dead=1;life--;continue}drawMob(m)}mobs=mobs.filter(m=>!m.dead&&m.h>0);for(let p of plats)if(p.t){let q=p.t;q.cd-=dt;if(q.cd<=0){let st={archer:[28,200,.5],cannon:[70,180,1.2],ice:[16,175,.7],fire:[48,205,.8]}[q.k],tar=null,md=1e9;for(let m of mobs){let u=at(m.q),d=Math.hypot(u[0]-p.x,u[1]-p.y);if(d<st[1]&&d<md){md=d;tar=m}}if(tar){tar.h-=st[0];if(q.k=='ice')tar.s*=.97;q.cd=st[2]}}}if(run&&!left&&!mobs.length)run=0;document.querySelector('#gold').textContent=Math.floor(gold);document.querySelector('#life').textContent=life;document.querySelector('#speed').textContent=spd+'x';requestAnimationFrame(loop)}size();total=L.reduce((a,b)=>a+b,0);addEventListener('resize',()=>{size();total=L.reduce((a,b)=>a+b,0)});requestAnimationFrame(loop)</script></body></html>
