<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reinos em Ruína — Tower Defense</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08110d;color:#f5ead7;font-family:Inter,system-ui,Arial}body{display:flex;flex-direction:column}#hud{height:66px;flex:0 0 66px;background:linear-gradient(#17241f,#101915);border-bottom:2px solid #34483d;display:flex;align-items:center;gap:12px;padding:8px 14px;box-shadow:0 3px 14px #0008;z-index:5}.brand{font-weight:900;letter-spacing:.8px;margin-right:10px}.pill{background:#202f29;border:1px solid #40574b;border-radius:9px;padding:7px 11px}.gold{color:#ffd166}.life{color:#ff7474}.wave{color:#d8c2ff}button{border:1px solid #6f8a7a;background:#30483c;color:#fff;padding:8px 13px;border-radius:8px;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.15)}#start{background:#7b5424;border-color:#b4874b}.spacer{flex:1}#game{position:relative;flex:1;min-height:0}canvas{display:block;width:100%;height:100%}#panel{position:absolute;right:18px;bottom:18px;width:265px;background:rgba(16,24,20,.94);border:1px solid #52695b;border-radius:12px;padding:14px;box-shadow:0 8px 30px #0008;display:none;z-index:4}.ptitle{font-size:18px;font-weight:900;margin-bottom:8px}.stat{display:flex;justify-content:space-between;padding:4px 0;color:#cdd8d0}.next{margin-top:8px;border-top:1px solid #3a4a42;padding-top:8px}.hint{font-size:12px;color:#94a59b;margin-top:8px;line-height:1.4}.good{color:#8be29c}.towerBtns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.towerBtns button{font-size:12px;padding:7px}.toast{position:absolute;left:50%;top:20px;transform:translateX(-50%);background:#111b16dd;border:1px solid #536a5c;border-radius:10px;padding:9px 14px;opacity:0;pointer-events:none;transition:.2s;z-index:6}.toast.show{opacity:1}</style></head><body><div id="hud"><div class="brand">🏰 REINOS EM RUÍNA</div><div class="pill gold">🪙 <b id="gold">1000</b></div><div class="pill life">❤ <b id="life">20</b></div><div class="pill wave">🌊 Onda <b id="wave">0</b></div><div class="pill">👹 <b id="alive">0</b></div><div class="spacer"></div><button id="start">COMEÇAR ONDA</button><button id="speed">1×</button></div><div id="game"><canvas id="c"></canvas><div id="toast" class="toast"></div><div id="panel"></div></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let W=0,H=0,DPR=1,scale=1,ox=0,oy=0,gold=1000,life=20,wave=0,running=false,spawnTimer=0,toSpawn=0,gameSpeed=1,last=0,selected=null,mobs=[],shots=[],particles=[];const basePath=[[70,105],[245,105],[245,285],[470,285],[470,120],[735,120],[735,420],[950,420],[950,230],[1215,230],[1215,535],[1300,535]];let path=[],seg=[],total=0,platforms=[];
function resize(){DPR=devicePixelRatio||1;W=c.clientWidth;H=c.clientHeight;c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);const sx=(W-80)/1320,sy=(H-50)/600;scale=Math.min(sx,sy);ox=(W-1320*scale)/2;oy=(H-600*scale)/2;path=basePath.map(([x,y])=>[x*scale+ox,y*scale+oy]);seg=[];total=0;for(let i=1;i<path.length;i++){let d=Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]);seg.push(d);total+=d}buildPlatforms()}function nearPath(x,y,r){for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i],dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy,u=Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/l));if(Math.hypot(x-(a[0]+u*dx),y-(a[1]+u*dy))<r)return true}return false}function nearSpawnExit(x,y){return Math.hypot(x-path[0][0],y-path[0][1])<105||Math.hypot(x-path[path.length-1][0],y-path[path.length-1][1])<115}function buildPlatforms(){platforms=[];for(let i=1;i<path.length-1;i++){const a=path[i-1],b=path[i],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,h=Math.abs(a[0]-b[0])>Math.abs(a[1]-b[1]),offs=h?[[0,88],[0,-88]]:[[88,0],[-88,0]];for(const [dx,dy] of offs){const x=mx+dx,y=my+dy;if(x>45&&x<W-45&&y>45&&y<H-45&&!nearPath(x,y,55)&&!nearSpawnExit(x,y))platforms.push({x,y,tower:null})}}}function atDist(q){let d=q;for(let i=1;i<path.length;i++){if(d<=seg[i-1]){const a=path[i-1],b=path[i],u=d/seg[i-1];return{x:a[0]+(b[0]-a[0])*u,y:a[1]+(b[1]-a[1])*u,ang:Math.atan2(b[1]-a[1],b[0]-a[0])}}d-=seg[i-1]}const a=path[path.length-2],b=path[path.length-1];return{x:b[0],y:b[1],ang:Math.atan2(b[1]-a[1],b[0]-a[0])}}
const defs={goblin:{hp:65,speed:118,reward:24},spider:{hp:48,speed:158,reward:22},orc:{hp:155,speed:82,reward:42},shaman:{hp:120,speed:94,reward:55},troll:{hp:430,speed:54,reward:100}};function spawnMob(){let r=Math.random(),type=r<.58?'goblin':r<.76?'spider':r<.9?'orc':r<.97?'shaman':'troll',d=defs[type],hp=d.hp*(1+wave*.11);mobs.push({type,q:-Math.random()*35,s:d.speed*(1+Math.min(.18,wave*.012)),hp,max:hp,phase:Math.random()*10,death:0,burn:0})}
const towerDefs={archer:{name:'Arqueiro',cost:120,icon:'🏹',damage:32,range:210,cool:.46,desc:'Ataques rápidos e precisos.'},cannon:{name:'Canhão',cost:240,icon:'💣',damage:92,range:175,cool:1.35,desc:'Explode grupos de inimigos.'},ice:{name:'Gelo',cost:190,icon:'❄️',damage:20,range:185,cool:.68,desc:'Diminui a velocidade.'},fire:{name:'Fogo',cost:300,icon:'🔥',damage:58,range:210,cool:.82,desc:'Dano forte e queimadura.'}};function towerStats(t){let d=towerDefs[t.type],l=t.level;return{damage:d.damage*(1+.42*(l-1)),range:d.range+13*(l-1),cool:d.cool*Math.pow(.91,l-1),upgrade:Math.round(d.cost*(.72+.32*l))}}function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1400)}function chooseTower(p,k){if(!towerDefs[k]||gold<towerDefs[k].cost){toast('Ouro insuficiente');return}gold-=towerDefs[k].cost;p.tower={type:k,level:1,cool:0};renderPanel()}function upgrade(){if(!selected?.tower)return;let u=towerStats(selected.tower).upgrade;if(gold<u){toast('Ouro insuficiente');return}gold-=u;selected.tower.level++;renderPanel()}function sell(){if(!selected?.tower)return;let d=towerDefs[selected.tower.type],t=selected.tower,invest=d.cost;for(let i=1;i<t.level;i++)invest+=Math.round(d.cost*(.72+.32*i));gold+=Math.floor(invest*.7);selected.tower=null;renderPanel()}
function renderPanel(){const e=document.getElementById('panel');if(!selected){e.style.display='none';return}e.style.display='block';if(!selected.tower){e.innerHTML='<div class="ptitle">Construir defesa</div><div class="hint">Cada arma tem função e custo diferentes.</div><div class="towerBtns">'+Object.entries(towerDefs).map(([k,d])=>`<button data-k="${k}">${d.icon} ${d.name}<br>🪙 ${d.cost}</button>`).join('')+'</div>';e.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>chooseTower(selected,b.dataset.k));return}const t=selected.tower,d=towerDefs[t.type],s=towerStats(t),ns={damage:d.damage*(1+.42*t.level),range:d.range+13*t.level,cool:d.cool*Math.pow(.91,t.level)};e.innerHTML=`<div class="ptitle">${d.icon} ${d.name} — Nv. ${t.level}</div><div class="stat"><span>Dano</span><b>${Math.round(s.damage)}</b></div><div class="stat"><span>Alcance</span><b>${Math.round(s.range)}</b></div><div class="stat"><span>Recarga</span><b>${s.cool.toFixed(2)}s</b></div><div class="next"><b>Próximo nível</b><div class="stat"><span>Dano</span><span class="good">${Math.round(s.damage)} → ${Math.round(ns.damage)}</span></div><div class="stat"><span>Alcance</span><span class="good">${Math.round(s.range)} → ${Math.round(ns.range)}</span></div><div class="stat"><span>Recarga</span><span class="good">${s.cool.toFixed(2)} → ${ns.cool.toFixed(2)}s</span></div><button id="up" style="width:100%;margin-top:7px">⬆ Melhorar — 🪙 ${s.upgrade}</button><button id="sell" style="width:100%;margin-top:7px;background:#4a302c">Vender</button></div><div class="hint">${d.desc}</div>`;e.querySelector('#up').onclick=upgrade;e.querySelector('#sell').onclick=sell}
c.addEventListener('click',e=>{const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let hit=platforms.find(p=>Math.hypot(x-p.x,y-p.y)<34);selected=hit||null;renderPanel()});document.getElementById('start').onclick=()=>{if(running)return;wave++;running=true;toSpawn=9+wave*3;spawnTimer=0;document.getElementById('wave').textContent=wave;toast('Onda '+wave+' começou!')};document.getElementById('speed').onclick=()=>{gameSpeed=gameSpeed===1?1.5:gameSpeed===1.5?2:1;document.getElementById('speed').textContent=gameSpeed+'×'};
function ground(){ctx.fillStyle='#426f3d';ctx.fillRect(0,0,W,H);for(let i=0;i<80;i++){let x=(i*97+31)%W,y=(i*53+17)%H;ctx.fillStyle=i%3?'#4d7b45':'#3d6839';ctx.beginPath();ctx.arc(x,y,1.5+i%3,0,7);ctx.fill()}ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=72;ctx.strokeStyle='#293d2d';ctx.beginPath();path.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ctx.lineWidth=58;ctx.strokeStyle='#a68f6d';ctx.beginPath();path.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle='#c2ad88';ctx.beginPath();path.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();zone(path[0],'ENTRADA','⛩️');zone(path.at(-1),'CASTELO','🏰')}function zone(p,l,icon){ctx.fillStyle='#65452d';ctx.beginPath();ctx.roundRect(p[0]-43,p[1]-45,86,90,13);ctx.fill();ctx.fillStyle='#eadbc1';ctx.font='900 12px system-ui';ctx.textAlign='center';ctx.fillText(l,p[0],p[1]-55);ctx.font='30px serif';ctx.fillText(icon,p[0],p[1]+11)}function platformsDraw(){for(const p of platforms){ctx.fillStyle=p.tower?'#756a55':'#c4aa79';ctx.beginPath();ctx.arc(p.x,p.y,31,0,7);ctx.fill();ctx.strokeStyle='#5c513f';ctx.lineWidth=3;ctx.stroke();if(p.tower){ctx.font='25px serif';ctx.textAlign='center';ctx.fillText(towerDefs[p.tower.type].icon,p.x,p.y+8);ctx.fillStyle='#171b18';ctx.font='bold 10px system-ui';ctx.fillText('Nv '+p.tower.level,p.x,p.y+43)}if(selected===p){ctx.strokeStyle='#ffe08a';ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.x,p.y,36,0,7);ctx.stroke()}}}
function limb(a,b,w,col){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}function humanoid(type,step){let body=type==='troll'?'#65774b':type==='orc'?'#5d7d42':type==='shaman'?'#6f8c4d':'#718f4b',skin=type==='goblin'?'#94ad5e':type==='orc'?'#71914b':'#a0b96b',dark='#3b472d',arm=step*5;limb([-11,15],[-18+arm,32],8,dark);limb([11,15],[18-arm,32],8,dark);ctx.fillStyle=body;ctx.beginPath();ctx.roundRect(-17,-3,34,34,10);ctx.fill();ctx.fillStyle=skin;ctx.beginPath();ctx.arc(0,-18,19,0,7);ctx.fill();ctx.fillStyle='#35271f';ctx.beginPath();ctx.moveTo(-19,-25);ctx.lineTo(-31,-34);ctx.lineTo(-13,-30);ctx.lineTo(0,-40);ctx.lineTo(14,-30);ctx.lineTo(31,-34);ctx.lineTo(19,-20);ctx.fill();ctx.fillStyle='#efe5c8';ctx.fillRect(-10,-19,6,6);ctx.fillRect(4,-19,6,6);ctx.fillStyle='#111';ctx.fillRect(-8,-18,3,3);ctx.fillRect(6,-18,3,3);ctx.fillStyle='#4c3024';ctx.beginPath();ctx.arc(0,-7,8,0,Math.PI);ctx.fill();if(type==='shaman'){limb([14,8],[27,-28],4,'#b9874d');ctx.fillStyle='#8b5b3c';ctx.beginPath();ctx.arc(27,-31,7,0,7);ctx.fill()}else if(type==='troll'){limb([14,7],[30+arm,-4],9,dark);ctx.fillStyle='#7c684c';ctx.fillRect(27,-12,12,30)}else{limb([14,8],[27-arm,-4],7,dark);ctx.strokeStyle='#c6c1a9';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(27-arm,-11);ctx.lineTo(27-arm,10);ctx.stroke()}if(type==='goblin'){ctx.fillStyle='#7c5635';ctx.fillRect(-19,24,12,13);ctx.fillRect(7,24,12,13);ctx.fillStyle='#b89455';ctx.fillRect(-19,24,12,4);ctx.fillRect(7,24,12,4)}}function spider(step){ctx.fillStyle='#29232d';ctx.beginPath();ctx.ellipse(0,5,20,16,0,0,7);ctx.fill();ctx.fillStyle='#514457';ctx.beginPath();ctx.arc(0,-10,12,0,7);ctx.fill();ctx.fillStyle='#d85b57';ctx.beginPath();ctx.arc(-6,-12,3,0,7);ctx.arc(6,-12,3,0,7);ctx.fill();ctx.strokeStyle='#18151c';ctx.lineWidth=4;for(let i=-3;i<=3;i++){let y=i*5;ctx.beginPath();ctx.moveTo(-10,y);ctx.lineTo(-30,y+step*3-7);ctx.moveTo(10,y);ctx.lineTo(30,y-step*3-7);ctx.stroke()}}
function mobDraw(m){let p=atDist(m.q),n=atDist(Math.min(total,m.q+5)),ang=Math.atan2(n.y-p.y,n.x-p.x),step=Math.sin(m.phase*8),S=m.type==='troll'?1.55:m.type==='orc'?1.28:m.type==='shaman'?1.16:m.type==='spider'?1.05:1.12;ctx.save();ctx.translate(p.x,p.y-Math.abs(step)*.8);ctx.rotate(ang);ctx.scale(Math.cos(ang)<0?-S:S,S);if(m.death){ctx.globalAlpha=Math.max(0,1-m.death/.45);ctx.translate(0,m.death*16);ctx.rotate(m.death*5)}m.type==='spider'?spider(step):humanoid(m.type,step);ctx.restore();if(!m.death){ctx.fillStyle='#201a16';ctx.fillRect(p.x-25*S,p.y-43*S,50*S,5);ctx.fillStyle='#65d26d';ctx.fillRect(p.x-25*S,p.y-43*S,50*S*Math.max(0,m.hp/m.max),5)}}
function update(dt){if(running){spawnTimer-=dt;if(toSpawn>0&&spawnTimer<=0){spawnMob();toSpawn--;spawnTimer=.58/Math.min(1.5,1+wave*.025)}if(toSpawn===0&&!mobs.length)running=false}for(const m of mobs){if(m.death){m.death+=dt;continue}m.q+=m.s*dt;m.phase+=dt;if(m.q>=total){m.death=.001;life--;continue}}for(const p of platforms)if(p.tower){let t=p.tower,s=towerStats(t);t.cool-=dt;if(t.cool<=0){let target=null,best=-1;for(const m of mobs)if(!m.death){let q=atDist(m.q),dd=Math.hypot(q.x-p.x,q.y-p.y);if(dd<=s.range&&m.q>best){best=m.q;target=m}}if(target){target.hp-=s.damage;if(t.type==='ice')target.s*=.89;if(t.type==='fire')target.burn=(target.burn||0)+8;if(t.type==='cannon')for(const m2 of mobs){let a=atDist(m2.q),b=atDist(target.q);if(m2!==target&&Math.hypot(a.x-b.x,a.y-b.y)<65)m2.hp-=s.damage*.38;t.cool=s.cool}}}for(const m of mobs)if(m.burn&&!m.death)m.hp-=m.burn*dt;for(const m of mobs)if(m.hp<=0&&!m.death){m.death=.001;gold+=defs[m.type].reward;for(let i=0;i<8;i++)particles.push({x:atDist(m.q).x,y:atDist(m.q).y,vx:(Math.random()-.5)*70,vy:(Math.random()-.5)*70,t:0})}for(const p of particles){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt}particles=particles.filter(p=>p.t<.5);mobs=mobs.filter(m=>!m.death||m.death<.45)}function draw(){ctx.clearRect(0,0,W,H);ground();platformsDraw();mobs.forEach(mobDraw);particles.forEach(p=>{ctx.globalAlpha=1-p.t/.5;ctx.fillStyle='#ffd166';ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1});document.getElementById('gold').textContent=Math.floor(gold);document.getElementById('life').textContent=life;document.getElementById('alive').textContent=mobs.filter(m=>!m.death).length;if(life<=0){running=false;toast('O reino caiu — recarregue para tentar novamente')}}function loop(t){let dt=Math.min(.035,(t-last)/1000||.016)*gameSpeed;last=t;update(dt);draw();requestAnimationFrame(loop)}addEventListener('resize',resize);resize();requestAnimationFrame(loop);
</script></body></html>
